<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project — Zakmonsters</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<main id="inhoud">
  <div id="pagina" class="omhulsel"><p class="laden">Laden…</p></div>
</main>

<footer class="voet">
  <div class="omhulsel"><p id="voet"></p></div>
</footer>

<script type="module">
import { esc, contentUrl, markdown, laadSite, laadProject, laadVoortgang } from './assets/content.js';
import { statusHtml, voortgangHtml, downloadsHtml } from './assets/site.js';

const $ = (id) => document.getElementById(id);
const id = new URLSearchParams(location.search).get('p') || '';

// De site heeft geen menubalk meer. Eén terugweg blijft nodig: zonder die link kom je vanaf
// een gedeelde projectlink alleen met de terugknop van de browser bij de rest van de site.
const TERUG = '<a class="terug" href="index.html">← Alle projecten</a>';

// De plaat draagt de titel al, dus er staat geen kop overheen. Hij wordt hier tot 16:9 gecropt
// (de bron is 4:3, voor de kaarten op de home) zodat hij niet het halve scherm inneemt.
//
// De <h1> blijft wél bestaan, alleen onzichtbaar: een pagina zonder kop is voor een schermlezer
// en voor een zoekmachine een naamloze pagina, en de plaat kan die rol niet overnemen.
function held(project) {
  const url = contentUrl(project.teaser);
  const kleur = /^#[0-9a-f]{3,8}$/i.test(String(project.kleur || '')) ? project.kleur : '#3b4a63';
  const naam = project.naam || project.id;
  return `<h1 class="verborgen">${esc(naam)}</h1>
    <div class="projectheld${url ? '' : ' projectheld--zonderplaat'}"
       style="--kaartkleur:${esc(kleur)};${url ? `background-image:url('${esc(url)}');` : ''}">
      ${url ? '' : `<span class="projectheld-naam">${esc(naam)}</span>`}
      ${statusHtml(project)}
    </div>`;
}

(async () => {
  const site = await laadSite().catch(() => ({}));
  $('voet').innerHTML = markdown(site.footer || '');

  let project;
  try {
    project = await laadProject(id);
  } catch (err) {
    console.error(err);
    $('pagina').innerHTML = `${TERUG}
      <div class="fout-blok">
        <h1>Project niet gevonden</h1>
        <p>Dit project bestaat (nog) niet. <a href="index.html">Terug naar alle projecten</a>.</p>
      </div>`;
    return;
  }

  document.title = `${project.naam || project.id} — ${site.titel || 'Zakmonsters'}`;
  $('pagina').innerHTML = `
    ${TERUG}
    ${held(project)}
    <div class="projectbody">
      <article class="projecttekst">${markdown(project.body || '')}</article>
      <aside class="projectzij">
        <section class="blok" id="voortgangBlok" hidden>
          <h2>Voortgang</h2>
          <div id="voortgangSlot"></div>
          <p class="klein">Live uit de vertaaleditor.</p>
        </section>
        <section class="blok">
          <h2>Downloads</h2>
          ${downloadsHtml(project)}
        </section>
      </aside>
    </div>`;

  if (project.voortgang) {
    const html = voortgangHtml(project, await laadVoortgang(site.voortgangBron));
    if (html) { $('voortgangSlot').innerHTML = html; $('voortgangBlok').hidden = false; }
  }
})();
</script>
</body>
</html>
