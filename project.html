<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project — Zakmonsters</title>
<link rel="icon" type="image/png" href="assets/pokeball.png">
<link rel="stylesheet" href="assets/site.css">
<script type="application/json" id="ingebakken">{"site":{"titel":"Project Zakmonsters","ondertitel":"","intro":"Wij lokaliseren oude Pokémon-games naar het Nederlands. Dat is handwerk: we automatiseren ons vertaalproces niet met Google Translate of AI-vertaalsoftware. We wegen af welke teksten het beste werken en lokaliseren Pokémon-terminologie naar het Nederlands. Dat doen we met een groep fanatieke vrijwilligers.","groepen":[{"titel":"Generatie 1","projecten":["rood","geel"]},{"titel":"Generatie 2","projecten":["goud-zilver","kristal","pokemon-pinball"]}],"voortgangBron":"https://vertalen.zakmonsters.nl/api/public/progress","meedoen":{"titel":"Meehelpen?","tekst":"Lijkt het je leuk om te helpen vertalen, redigeren of testen? Of wil je gewoon met ons komen kletsen? Kom gerust eens langs in onze Discord.","discord":{"label":"Discord","url":"https://discord.gg/ftebcBBMRd"}},"footer":"Fanproject zonder winstoogmerk. Pokémon is eigendom van The Pokémon Company. Wij bieden geen ROMs aan, alleen patches die je kunt toepassen op jouw legaal verworven ROM-dumps. We helpen je niet met het vinden van ROMs."},"projecten":{"geel":{"id":"geel","naam":"Pokémon Geel","status":"bezig","teaser":"teasers/geel.png","kleur":"#e6c229","voortgang":"pokeyellow-nl","downloads":[{"label":"Patch (Geel)","url":"https://github.com/wfowler1/pokeyellow-nl/releases","toelichting":"Nieuwste patch op de releasepagina"}],"body":"\nWIP\n"},"goud-zilver":{"id":"goud-zilver","naam":"Pokémon Goud & Zilver","status":"bezig","teaser":"teasers/zilver.png","kleur":"#c9a227","voortgang":"pokegold-nl","downloads":[{"label":"Patches (Goud & Zilver)","url":"https://github.com/wfowler1/pokegold-nl/releases","toelichting":"Nieuwste patch op de releasepagina"}],"body":"\nWIP\n"},"kristal":{"id":"kristal","naam":"Pokémon Kristal","status":"voltooid","samenvatting":"De uitgebreide versie van Goud en Zilver, met de Suicune-verhaallijn.","teaser":"teasers/kristal-16-9.png","kleur":"#4f9bd9","voortgang":"pokecrystal-nl","downloads":[{"label":"Patch (Kristal)","url":"https://github.com/wfowler1/pokecrystal-nl/releases","toelichting":"Nieuwste patch op de releasepagina"}],"body":"\nPokémon Kristal is een volledige, Nederlandstalige lokalisatie van Pokémon Crystal, gebaseerd op de disassembly van Pokémon Crystal door pret. Daarbij is veel gekeken naar andere Pokémon-media die naar het Nederlands zijn vertaald, zoals het ruilkaartspel, de animatieserie en de manga.\n\n## Wat is er veranderd?\n\n- Meer dan 24.000 vertaalde regels aan tekst. Iedere regel is achteraf door een tweede persoon geredigeerd, waarna her en der nog iets is getweakt na een uitbundige testperiode. Loop je toch nog tegen foutjes aan? Laat het ons weten in onze Discord, dan corrigeren we het!\n- Alle menu's, voorwerpen en aanvallen zijn vertaald. Er is altijd eerst gekeken of er al een officiële Nederlandse vertaling voor een term bestond. Voor nog niet eerdere lokalisaties is een logische optie bedacht. - Hier en daar zijn aanpassingen gemaakt om de game consistent met latere generaties te maken: De 'PINK BOW' en 'POLKADOT BOW' heten bijvoorbeeld de 'ZIJDEN SJAAL', gebaseerd op de latere 'SILK SCARF'.\n- Namen van Pokémon, NPC's, steden en dorpen zijn grotendeels Engels gebleven. Op die manier proberen we consistent te blijven met de animatieserie en manga, waarin ook de Engelse namen worden gehanteerd. Dit maakt het ook makkelijker om online iets op te zoeken wanneer je vast komt te zitten. Specifiekere locaties zijn her en der wel gelokaliseerd: 'MT. MORTAR' is bijvoorbeeld de 'VIJZELBERG', 'ILEX FOREST' is het 'EIKENWOUD'.\n- Een zo authentiek mogelijke ervaring. De game is grotendeels onaangeraakt gebleven, zodat het aanvoelt als een lokalisatie die in 2001 had kunnen verschijnen. Wel is het mogelijk Celebi te vangen nadat je de game hebt uitgespeeld - het is immers niet meer mogelijk die Pokémon nog op ouderwetse wijze op een evenement te bemachtigen.\n"},"pokemon-pinball":{"id":"pokemon-pinball","naam":"Pokémon Pinball","status":"gepland","kleur":"#3b4a63","voortgang":"pokepinball","body":"\n## Over dit project\n\nNog te schrijven.\n"},"rood":{"id":"rood","naam":"Pokémon Rood & Blauw","status":"bezig","samenvatting":"Waar het allemaal begon: Kanto, 151 Pokémon en de reis naar de Elite Vier.","kleur":"#d1534a","voortgang":"pokered-nl","downloads":[{"label":"Patches (Rood & Blauw)","url":"https://github.com/wfowler1/pokered-nl/releases","toelichting":"Nieuwste patch op de releasepagina"}],"body":"\nWIP\n"}},"edities":{"kristal":{"id":"kristal","naam":"Speciale Editie","status":"bezig","voortgang":"kristal-se","body":"\nIn de Speciale Editie hebben we nóg meer gelokaliseerd. Ook de namen van steden, Pokémon en sommige NPC's zijn nu Nederlandstalig. Daarnaast bevat deze versie van de game tal van verbeteringen, zoals de running shoes, etc.\n\nWIP, aanvullen.\n"}}}</script>
</head>
<body>
<main id="inhoud">
  <div id="pagina" class="omhulsel"><p class="laden">Laden…</p></div>
</main>

<footer class="voet">
  <div class="omhulsel"><p id="voet"></p></div>
</footer>

<script type="module">
import { esc, contentUrl, markdown, laadSite, laadProject, laadEditie, laadVoortgang } from './assets/content.js';
import { statusHtml, voortgangHtml, downloadsHtml } from './assets/site.js';

const $ = (id) => document.getElementById(id);
const id = new URLSearchParams(location.search).get('p') || '';

// De site heeft geen menubalk meer. Eén terugweg blijft nodig: zonder die link kom je vanaf
// een gedeelde projectlink alleen met de terugknop van de browser bij de rest van de site.
const TERUG = '<a class="terug" href="index.html">← Alle projecten</a>';

// De plaat draagt de titel al, dus er staat geen kop overheen. Hij wordt hier tot 16:9 gecropt
// (de bron is 4:3, voor de kaarten op de home) zodat hij niet het halve scherm inneemt.
//
// De <h1> blijft wél bestaan, alleen onzichtbaar: een pagina zonder kop is voor een schermlezer
// en voor een zoekmachine een naamloze pagina, en de plaat kan die rol niet overnemen.
function held(project) {
  const url = contentUrl(project.teaser);
  const kleur = /^#[0-9a-f]{3,8}$/i.test(String(project.kleur || '')) ? project.kleur : '#3b4a63';
  const naam = project.naam || project.id;
  return `<h1 class="verborgen">${esc(naam)}</h1>
    <div class="projectheld${url ? '' : ' projectheld--zonderplaat'}"
       style="--kaartkleur:${esc(kleur)};${url ? `background-image:url('${esc(url)}');` : ''}">
      ${url ? '' : `<span class="projectheld-naam">${esc(naam)}</span>`}
      ${statusHtml(project)}
    </div>`;
}

// Heeft een project een speciale editie, dan wisselen twee knoppen tussen beide uitvoeringen.
// De editie erft alles wat ze niet zelf invult (plaat, kleur, status), zodat je in het CMS
// alleen hoeft in te vullen wat écht anders is.
function wisselHtml(project, editie, actief) {
  return `<div class="wissel" role="tablist" aria-label="Uitvoering">
      <button class="wisselknop${actief === 'basis' ? ' is-actief' : ''}" data-editie="basis"
        role="tab" aria-selected="${actief === 'basis'}">${esc(project.naam || project.id)}</button>
      <button class="wisselknop${actief === 'editie' ? ' is-actief' : ''}" data-editie="editie"
        role="tab" aria-selected="${actief === 'editie'}">${esc(editie.naam || 'Speciale editie')}</button>
    </div>`;
}

(async () => {
  const site = await laadSite().catch(() => ({}));
  $('voet').innerHTML = markdown(site.footer || '');

  let project;
  try {
    project = await laadProject(id);
  } catch (err) {
    console.error(err);
    $('pagina').innerHTML = `${TERUG}
      <div class="fout-blok">
        <h1>Project niet gevonden</h1>
        <p>Dit project bestaat (nog) niet. <a href="index.html">Terug naar alle projecten</a>.</p>
      </div>`;
    return;
  }

  const editie = await laadEditie(id);
  const voortgang = await laadVoortgang(site.voortgangBron);

  document.title = `${project.naam || project.id} — ${site.titel || 'Zakmonsters'}`;

  function toon(welke) {
    // De editie is het project met een paar velden overschreven; wat ze niet invult, erft ze.
    const actief = welke === 'editie' && editie
      ? { ...project, ...Object.fromEntries(Object.entries(editie).filter(([, v]) => v !== '' && v != null)) }
      : project;
    const balk = actief.voortgang ? voortgangHtml(actief, voortgang) : '';

    // Op een breed scherm staan de plaat en de blokken naast elkaar, met gelijke boven- en
    // onderrand; op een smal scherm vallen ze onder elkaar. De projecttekst loopt daaronder
    // over de volle breedte, want die leest niet prettig in een smalle kolom naast een plaat.
    $('pagina').innerHTML = `
      ${TERUG}
      <div class="projectkop">
        ${held(actief)}
        <aside class="projectzij">
          ${balk ? `<section class="blok">
            <h2>Voortgang</h2>
            ${balk}
          </section>` : ''}
          <section class="blok">
            <h2>Downloads</h2>
            ${downloadsHtml(actief)}
          </section>
        </aside>
      </div>
      ${editie ? wisselHtml(project, editie, welke) : ''}
      <article class="projecttekst">${markdown(actief.body || '')}</article>`;

    for (const knop of document.querySelectorAll('.wisselknop')) {
      knop.onclick = () => {
        toon(knop.dataset.editie);
        // In de URL zodat je rechtstreeks naar de speciale editie kunt linken.
        const zoek = new URLSearchParams(location.search);
        if (knop.dataset.editie === 'editie') zoek.set('editie', '1'); else zoek.delete('editie');
        history.replaceState(null, '', `?${zoek}`);
      };
    }
  }

  toon(editie && new URLSearchParams(location.search).get('editie') ? 'editie' : 'basis');
})();
</script>
</body>
</html>
