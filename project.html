**Hoofd vertaling:** Bastiaan Vroegop\n- **Vertalers:** Eline Muijres, Randolf Bouwsma, Calvin Foe\n"},"pokemon-pinball":{"id":"pokemon-pinball","naam":"Pokémon Pinball","status":"gepland","teaser":"teasers/pinbal.png","kleur":"#3b4a63","body":"\n\n## Over dit project\n\nNog te schrijven.\n"},"pokemon-ruilkaartspel":{"id":"pokemon-ruilkaartspel","naam":"Pokémon Ruilkaartspel","status":"voltooid","teaser":"teasers/tcg2.png","kleur":"#3b4a63","voortgang":"poketcg_v2_nl","downloads":[{"label":"Download","url":"https://github.com/JappaWakka/poketcg_v2_nl/releases/tag/v1.7"}],"body":"\n## Over dit project\n\nPokémon Ruilkaartspel - een Nederlandse vertaling van Pokémon Trading Card Game op de Gameboy (Color) door JappaWakka.\nDeze romhack is gebaseerd op Shaoden's poketcg_v2 romhack sjabloon met wat extra aanpassingen en verbeteringen zoals dat Dr. Mason nu blauw haar heeft in plaats van wit haar, net zoals in het Japanse vervolg en dat de borden waarop de fase van het duel geschreven staan meer op die uit het Japanse vervolg lijken.\n"},"rood":{"id":"rood","naam":"Pokémon Rood & Blauw","status":"bezig","samenvatting":"Waar het allemaal begon: Kanto, 151 Pokémon en de reis naar de Elite Vier.","teaser":"teasers/poke-mon-red-aug-25-2023.jpg","kleur":"#d1534a","voortgang":"pokered-nl","downloads":[{"label":"Patches (Rood & Blauw)","url":"https://github.com/wfowler1/pokered-nl/releases","toelichting":"Nieuwste patch op de releasepagina"}],"body":"\nWIP\n"}},"edities":{"kristal":{"id":"kristal","naam":"Speciale Editie","status":"bezig","voortgang":"pokecrystal-nl-se","body":"\nIn de Speciale Editie hebben we nóg meer gelokaliseerd en zijn meerdere gameplayverbeteringen toegevoegd. \n\n## Wat is er veranderd?\n\nVanuit de gewone editie van Kristal zit dit er in:\n\n- **Meer dan 24.000 vertaalde regels aan tekst.** Iedere regel is achteraf door een tweede persoon geredigeerd, waarna her en der nog iets is getweakt na een uitbundige testperiode. Loop je toch nog tegen foutjes aan? Laat het ons weten in onze Discord, dan corrigeren we het!\n- **Alle menu's, voorwerpen en aanvallen zijn vertaald.** Er is altijd eerst gekeken of er al een officiële Nederlandse vertaling voor een term bestond. Voor nog niet eerdere lokalisaties is een logische optie bedacht. - **Hier en daar zijn aanpassingen gemaakt om de game consistent met latere generaties te maken. **De 'PINK BOW' en 'POLKADOT BOW' heten bijvoorbeeld de 'ZIJDEN SJAAL', gebaseerd op de latere 'SILK SCARF'.\n\nDaarnaast is dit toegevoegd:\n\n- **Gelokaliseerde locatienamen, npc-namen en meer.** Er is gezocht naar logisch klinkende Nederlandse varianten van veel locaties. Ecruteak City is bijvoorbeeld Teakstad, Professor Oak is omgedoopt tot Professor Eik. Daarnaast hebben alle 251 Pokémon een Nederlandse naam gekregen.\n- **Running shoes, stat split, etc.** Dit aanvullen!\n"}}}</script>

<body>
<header class="kopbalk">
  <div class="omhulsel kopbalk-binnen">
    <a class="merk" href="index.html">
      <img src="assets/pokeball.png" alt="" width="26" height="26">
      <span id="merknaam">Zakmonsters</span>
    </a>
    <nav class="menu" aria-label="Hoofdmenu">
      <a href="index.html">Projecten</a>
      <a href="pokedex.html" id="menuDex" hidden>Pokédex</a>
      <a href="aanvallen.html" id="menuAanvallen" hidden>Aanvallen</a>
      <a href="voorwerpen.html" id="menuVoorwerpen" hidden>Voorwerpen</a>
    </nav>
    <button class="themaknop" id="themaknop" type="button" aria-pressed="false">
      <svg class="maan" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="zon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-13.5a1 1 0 0 1 1 1V6a1 1 0 1 1-2 0V4.5a1 1 0 0 1 1-1zm0 15a1 1 0 0 1 1 1V21a1 1 0 1 1-2 0v-1.5a1 1 0 0 1 1-1zM3.5 12a1 1 0 0 1 1-1H6a1 1 0 1 1 0 2H4.5a1 1 0 0 1-1-1zm14.5 0a1 1 0 0 1 1-1h1.5a1 1 0 1 1 0 2H19a1 1 0 0 1-1-1zM5.6 5.6a1 1 0 0 1 1.4 0l1.1 1.1a1 1 0 0 1-1.4 1.4L5.6 7a1 1 0 0 1 0-1.4zm10.3 10.3a1 1 0 0 1 1.4 0l1.1 1.1a1 1 0 0 1-1.4 1.4l-1.1-1.1a1 1 0 0 1 0-1.4zm2.5-10.3a1 1 0 0 1 0 1.4L17.3 8.1a1 1 0 1 1-1.4-1.4L17 5.6a1 1 0 0 1 1.4 0zM8.1 15.9a1 1 0 0 1 0 1.4L7 18.4A1 1 0 0 1 5.6 17l1.1-1.1a1 1 0 0 1 1.4 0z"/></svg>
    </button>
  </div>

<main id="inhoud">
  <div id="pagina" class="omhulsel"><p class="laden">Laden…</p></div>
</main>

<footer class="voet">
  <div class="omhulsel"><p id="voet"></p></div>
</footer>

<script type="module">
import { esc, contentUrl, markdown, laadSite, laadProject, laadEditie, laadVoortgang } from './assets/content.js';
import { statusHtml, voortgangHtml, downloadsHtml, tweedePlaatHtml } from './assets/site.js';
import { kopbalk, merknaam } from './assets/kop.js';

kopbalk();

const $ = (id) => document.getElementById(id);
const id = new URLSearchParams(location.search).get('p') || '';

// De weg terug naar de lijst. De kopbalk brengt je er ook, maar boven de pagina zelf hoort te
// staan waar je vandaan komt — zeker als je hier via een gedeelde link binnenkomt.
const TERUG = '<a class="terug" href="index.html">← Alle projecten</a>';

// De plaat draagt de titel al, dus er staat geen kop overheen. Hij wordt hier tot 16:9 gecropt
// (de bron is 4:3, voor de kaarten op de home) zodat hij niet het halve scherm inneemt.
//
// De <h1> blijft wél bestaan, alleen onzichtbaar: een pagina zonder kop is voor een schermlezer
// en voor een zoekmachine een naamloze pagina, en de plaat kan die rol niet overnemen.
function held(project) {
  const url = contentUrl(project.teaser);
  const kleur = /^#[0-9a-f]{3,8}$/i.test(String(project.kleur || '')) ? project.kleur : '#3b4a63';
  const naam = project.naam || project.id;
  return `<h1 class="verborgen">${esc(naam)}</h1>
    <div class="projectheld${url ? '' : ' projectheld--zonderplaat'}"
       style="--kaartkleur:${esc(kleur)};${url ? `background-image:url('${esc(url)}');` : ''}">
      ${tweedePlaatHtml(project)}
      ${url ? '' : `<span class="projectheld-naam">${esc(naam)}</span>`}
      ${statusHtml(project)}
    </div>`;
}

// Heeft een project een speciale editie, dan wisselen twee knoppen tussen beide uitvoeringen.
// De editie erft alles wat ze niet zelf invult (plaat, kleur, status), zodat je in het CMS
// alleen hoeft in te vullen wat écht anders is.
function wisselHtml(project, editie, actief) {
  return `<div class="wissel" role="tablist" aria-label="Uitvoering">
      <button class="wisselknop${actief === 'basis' ? ' is-actief' : ''}" data-editie="basis"
        role="tab" aria-selected="${actief === 'basis'}">${esc(project.naam || project.id)}</button>
      <button class="wisselknop${actief === 'editie' ? ' is-actief' : ''}" data-editie="editie"
        role="tab" aria-selected="${actief === 'editie'}">${esc(editie.naam || 'Speciale editie')}</button>
    </div>`;
}

(async () => {
  const site = await laadSite().catch(() => ({}));
  merknaam(site.titel);
  $('voet').innerHTML = markdown(site.footer || '');

  let project;
  try {
    project = await laadProject(id);
  } catch (err) {
    console.error(err);
    $('pagina').innerHTML = `${TERUG}
      <div class="fout-blok">
        <h1>Project niet gevonden</h1>
        <p>Dit project bestaat (nog) niet. <a href="index.html">Terug naar alle projecten</a>.</p>
      </div>`;
    return;
  }

  const editie = await laadEditie(id);
  const voortgang = await laadVoortgang(site.voortgangBron);

  document.title = `${project.naam || project.id} — ${site.titel || 'Zakmonsters'}`;

  function toon(welke) {
    // De editie is het project met een paar velden overschreven; wat ze niet invult, erft ze.
    const actief = welke === 'editie' && editie
      ? { ...project, ...Object.fromEntries(Object.entries(editie).filter(([, v]) => v !== '' && v != null)) }
      : project;
    const balk = actief.voortgang ? voortgangHtml(actief, voortgang) : '';

    // Op een breed scherm staan de plaat en de blokken naast elkaar, met gelijke boven- en
    // onderrand; op een smal scherm vallen ze onder elkaar. De projecttekst loopt daaronder
    // over de volle breedte, want die leest niet prettig in een smalle kolom naast een plaat.
    $('pagina').innerHTML = `
      ${TERUG}
      <div class="projectkop">
        ${held(actief)}
        <aside class="projectzij">
          ${balk ? `<section class="blok">
            <h2>Voortgang</h2>
            ${balk}
          </section>` : ''}
          <section class="blok">
            <h2>Downloads</h2>
            ${downloadsHtml(actief)}
          </section>
        </aside>
      </div>
      ${editie ? wisselHtml(project, editie, welke) : ''}
      <article class="projecttekst">${markdown(actief.body || '')}</article>`;

    for (const knop of document.querySelectorAll('.wisselknop')) {
      knop.onclick = () => {
        toon(knop.dataset.editie);
        // In de URL zodat je rechtstreeks naar de speciale editie kunt linken.
        const zoek = new URLSearchParams(location.search);
        if (knop.dataset.editie === 'editie') zoek.set('editie', '1'); else zoek.delete('editie');
        history.replaceState(null, '', `?${zoek}`);
      };
    }
  }

  toon(editie && new URLSearchParams(location.search).get('editie') ? 'editie' : 'basis');
})();
</script>
</body>
</html>
