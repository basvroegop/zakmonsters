<script type="application/json" id="ingebakken">{"site":{"titel":"Project Zakmonsters","ondertitel":"","intro":"Wij lokaliseren oude Pokémon-games naar het Nederlands. Dat is handwerk: we automatiseren ons vertaalproces niet met Google Translate of AI-vertaalsoftware. We wegen af welke teksten het beste werken en lokaliseren Pokémon-terminologie naar het Nederlands. Dat doen we met een groep fanatieke vrijwilligers.","groepen":[{"titel":"Generatie 1","projecten":["rood","geel"]},{"titel":"Generatie 2","projecten":["goud-zilver","kristal"]}],"voortgangBron":"https://vertalen.zakmonsters.nl/api/public/progress","meedoen":{"titel":"Meehelpen?","tekst":"Lijkt het je leuk om te helpen vertalen, redigeren of testen? Of wil je gewoon met ons komen kletsen? Kom gerust eens langs in onze Discord.","discord":{"label":"Discord","url":"https://discord.gg/ftebcBBMRd"}},"footer":"Fanproject zonder winstoogmerk. Pokémon is eigendom van The Pokémon Company. Wij bieden geen ROMs aan, alleen patches die je kunt toepassen op jouw legaal verworven ROM-dumps. We helpen je niet met het vinden van ROMs."},"projecten":{"geel":{"id":"geel","naam":"Pokémon Geel","status":"bezig","kleur":"#e6c229","voortgang":"pokeyellow-nl","downloads":[{"label":"Patch (Geel)","url":"https://github.com/wfowler1/pokeyellow-nl/releases","toelichting":"Nieuwste patch op de releasepagina"}],"body":"\nWIP\n"},"goud-zilver":{"id":"goud-zilver","naam":"Pokémon Goud & Zilver","status":"bezig","kleur":"#c9a227","voortgang":"pokegold-nl","downloads":[{"label":"Patches (Goud & Zilver)","url":"https://github.com/wfowler1/pokegold-nl/releases","toelichting":"Nieuwste patch op de releasepagina"}],"body":"\nWIP\n"},"kristal":{"id":"kristal","naam":"Kristal","status":"voltooid","samenvatting":"De uitgebreide versie van Goud en Zilver, met de Suicune-verhaallijn.","teaser":"teasers/kristal-16-9.png","kleur":"#4f9bd9","voortgang":"pokecrystal-nl","downloads":[{"label":"Patch (Kristal)","url":"https://github.com/wfowler1/pokecrystal-nl/releases","toelichting":"Nieuwste patch op de releasepagina"}],"body":"\nPokémon Kristal is een volledige, Nederlandstalige lokalisatie van Pokémon Crystal, gebaseerd op de disassembly van Pokémon Crystal door pret. Daarbij is veel gekeken naar andere Pokémon-media die naar het Nederlands zijn vertaald, zoals het ruilkaartspel, de animatieserie en de manga.\n\n## Wat is er veranderd?\n\n- Meer dan 24.000 vertaalde regels aan tekst. Iedere regel is achteraf door een tweede persoon geredigeerd, waarna her en der nog iets is getweakt na een uitbundige testperiode. Loop je toch nog tegen foutjes aan? Laat het ons weten in onze Discord, dan corrigeren we het!\n- Alle menu's, voorwerpen en aanvallen zijn vertaald. Er is altijd eerst gekeken of er al een officiële Nederlandse vertaling voor een term bestond. Voor nog niet eerdere lokalisaties is een logische optie bedacht. - Hier en daar zijn aanpassingen gemaakt om de game consistent met latere generaties te maken: De 'PINK BOW' en 'POLKADOT BOW' heten bijvoorbeeld de 'ZIJDEN SJAAL', gebaseerd op de latere 'SILK SCARF'.\n- Namen van Pokémon, NPC's, steden en dorpen zijn grotendeels Engels gebleven. Op die manier proberen we consistent te blijven met de animatieserie en manga, waarin ook de Engelse namen worden gehanteerd. Dit maakt het ook makkelijker om online iets op te zoeken wanneer je vast komt te zitten. Specifiekere locaties zijn her en der wel gelokaliseerd: 'MT. MORTAR' is bijvoorbeeld de 'VIJZELBERG', 'ILEX FOREST' is het 'EIKENWOUD'.\n- Een zo authentiek mogelijke ervaring. De game is grotendeels onaangeraakt gebleven, zodat het aanvoelt als een lokalisatie die in 2001 had kunnen verschijnen. Wel is het mogelijk Celebi te vangen nadat je de game hebt uitgespeeld - het is immers niet meer mogelijk die Pokémon nog op ouderwetse wijze op een evenement te bemachtigen.\n"},"rood":{"id":"rood","naam":"Pokémon Rood & Blauw","status":"bezig","samenvatting":"Waar het allemaal begon: Kanto, 151 Pokémon en de reis naar de Elite Vier.","kleur":"#d1534a","voortgang":"pokered-nl","downloads":[{"label":"Patches (Rood & Blauw)","url":"https://github.com/wfowler1/pokered-nl/releases","toelichting":"Nieuwste patch op de releasepagina"}],"body":"\nWIP\n"}},"edities":{"kristal":{"id":"kristal","naam":"Speciale Editie","status":"bezig","voortgang":"https://github.com/wfowler1/pokecrystal-nl/tree/SpecialEdition","body":"\nIn de Speciale Editie hebben we nóg meer gelokaliseerd. Ook de namen van steden, Pokémon en sommige NPC's zijn nu Nederlandstalig. Daarnaast bevat deze versie van de game tal van verbeteringen, zoals de running shoes, etc.\n\nWIP, aanvullen.\n"}}}</script>
</head>
<body>
<main id="inhoud">
  <section class="held">
    <div class="omhulsel">
      <h1 id="titel">Zakmonsters</h1>
      <p class="ondertitel" id="ondertitel"></p>
      <div class="intro" id="intro"></div>
    </div>
  </section>

  <section class="projecten">
    <div class="omhulsel" id="groepen">
      <h2>Generatie 1</h2>
        <div class="kaarten"><a class="kaart kaart--zonderplaat" href="project.html?p=geel"
       aria-label="Pokémon Geel — Mee bezig">
      <span class="kaart-plaat" style="--kaartkleur:#e6c229;">
        <span class="kaart-naam">Pokémon Geel</span>
        <span class="status is-bezig">Mee bezig</span>
        
      </span>
    </a><a class="kaart kaart--zonderplaat" href="project.html?p=rood"
       aria-label="Pokémon Rood &amp; Blauw — Mee bezig — Waar het allemaal begon: Kanto, 151 Pokémon en de reis naar de Elite Vier.">
      <span class="kaart-plaat" style="--kaartkleur:#d1534a;">
        <span class="kaart-naam">Pokémon Rood &amp; Blauw</span>
        <span class="status is-bezig">Mee bezig</span>
        
      </span>
    </a></div>
<h2>Generatie 2</h2>
        <div class="kaarten"><a class="kaart" href="project.html?p=kristal"
       aria-label="Kristal — Voltooid — 100% vertaald — De uitgebreide versie van Goud en Zilver, met de Suicune-verhaallijn.">
      <span class="kaart-plaat" style="--kaartkleur:#4f9bd9;background-image:url('content/teasers/kristal-16-9.png');">
        
        <span class="status is-voltooid">Voltooid</span>
        <span class="kaart-pct">100%</span>
      <span class="kaart-balk is-af" aria-hidden="true"><i style="width:100%"></i></span>
      </span>
    </a><a class="kaart kaart--zonderplaat" href="project.html?p=goud-zilver"
       aria-label="Pokémon Goud &amp; Zilver — Mee bezig">
      <span class="kaart-plaat" style="--kaartkleur:#c9a227;">
        <span class="kaart-naam">Pokémon Goud &amp; Zilver</span>
        <span class="status is-bezig">Mee bezig</span>
        
      </span>
    </a></div>
    </div>
  </section>

  <section class="meedoen" id="meedoen" hidden>
    <div class="omhulsel">
      <h2 id="meedoenTitel"></h2>
      <div class="meedoen-tekst" id="meedoenTekst"></div>
      <div class="knoppen" id="meedoenKnop"></div>
    </div>
  </section>
</main>

<footer class="voet">
  <div class="omhulsel"><p id="voet"></p></div>
</footer>

<script type="module">
import { esc, veiligeUrl, markdown, laadSite, laadProjecten, laadVoortgang } from './assets/content.js';
import { kaartHtml, sorteerProjecten } from './assets/site.js';

const $ = (id) => document.getElementById(id);

// Zonder ingevulde uitnodigingslink verschijnt er geen knop. Een doodlopende Discord-link is
// erger dan geen knop: die kost een geïnteresseerde vrijwilliger een klik en vertrouwen.
function discordHtml(knop) {
  const url = veiligeUrl(knop && knop.url);
  if (!url) return '';
  return `<a class="knop knop--discord" href="${esc(url)}" target="_blank" rel="noopener">${esc(knop.label || 'Kom langs op onze Discord')}</a>`;
}

(async () => {
  let site;
  try {
    site = await laadSite();
  } catch (err) {
    $('groepen').innerHTML = '<p class="fout">De inhoud kon niet worden geladen. Ververs de pagina of probeer het later opnieuw.</p>';
    console.error(err);
    return;
  }

  document.title = `${site.titel || 'Zakmonsters'} — ${site.ondertitel || 'Nederlandse fanvertalingen'}`;
  $('titel').textContent = site.titel || 'Zakmonsters';
  $('ondertitel').textContent = site.ondertitel || '';
  $('intro').innerHTML = markdown(site.intro || '');
  $('voet').innerHTML = markdown(site.footer || '');

  if (site.meedoen && (site.meedoen.titel || site.meedoen.tekst)) {
    $('meedoen').hidden = false;
    $('meedoenTitel').textContent = site.meedoen.titel || 'Meehelpen?';
    $('meedoenTekst').innerHTML = markdown(site.meedoen.tekst || '');
    $('meedoenKnop').innerHTML = discordHtml(site.meedoen.discord);
  }

  // Projecten staan gebundeld onder een eigen kop ("Generatie 1", "Generatie 2", …). Een oudere
  // site.json met alleen een platte `projecten`-lijst blijft werken: die wordt één naamloze groep.
  const groepen = Array.isArray(site.groepen) && site.groepen.length
    ? site.groepen
    : [{ titel: '', projecten: site.projecten || [] }];

  const geladen = [];
  for (const groep of groepen) {
    geladen.push({
      titel: groep.titel || '',
      projecten: sorteerProjecten(await laadProjecten(groep.projecten)),
    });
  }
  const alles = geladen.flatMap((g) => g.projecten);
  if (!alles.length) {
    $('groepen').innerHTML = '<p class="leeg">Er staan nog geen projecten in de lijst.</p>';
    return;
  }

  // Eerst tekenen, daarna pas de voortgang ophalen: die komt van een andere server en mag de
  // pagina niet ophouden als die traag is of plat ligt.
  const teken = (voortgang) => {
    $('groepen').innerHTML = geladen
      .filter((g) => g.projecten.length)
      .map((g) => `${g.titel ? `<h2>${esc(g.titel)}</h2>` : ''}
        <div class="kaarten">${g.projecten.map((p) => kaartHtml(p, voortgang)).join('')}</div>`)
      .join('');
  };
  teken({});

  // Een voltooid project staat sowieso op 100%; alleen voor lopend werk is de editor nodig.
  const heeftLopend = alles.some((p) => p.voortgang && String(p.status || 'bezig').toLowerCase() !== 'voltooid');
  if (heeftLopend) teken(await laadVoortgang(site.voortgangBron));
})();
</script>
</body>
</html>
