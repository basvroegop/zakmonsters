-nl/releases","toelichting":"Nieuwste patch op de releasepagina"}],"body":"\nPokémon Kristal is een volledige, Nederlandstalige lokalisatie van Pokémon Crystal, gebaseerd op de disassembly van Pokémon Crystal door pret. Daarbij is veel gekeken naar andere Pokémon-media die naar het Nederlands zijn vertaald, zoals het ruilkaartspel, de animatieserie en de manga.\n\n## Wat is er veranderd?\n\n- Meer dan 24.000 vertaalde regels aan tekst. Iedere regel is achteraf door een tweede persoon geredigeerd, waarna her en der nog iets is getweakt na een uitbundige testperiode. Loop je toch nog tegen foutjes aan? Laat het ons weten in onze Discord, dan corrigeren we het!\n- Alle menu's, voorwerpen en aanvallen zijn vertaald. Er is altijd eerst gekeken of er al een officiële Nederlandse vertaling voor een term bestond. Voor nog niet eerdere lokalisaties is een logische optie bedacht. - Hier en daar zijn aanpassingen gemaakt om de game consistent met latere generaties te maken: De 'PINK BOW' en 'POLKADOT BOW' heten bijvoorbeeld de 'ZIJDEN SJAAL', gebaseerd op de latere 'SILK SCARF'.\n- Namen van Pokémon, NPC's, steden en dorpen zijn grotendeels Engels gebleven. Op die manier proberen we consistent te blijven met de animatieserie en manga, waarin ook de Engelse namen worden gehanteerd. Dit maakt het ook makkelijker om online iets op te zoeken wanneer je vast komt te zitten. Specifiekere locaties zijn her en der wel gelokaliseerd: 'MT. MORTAR' is bijvoorbeeld de 'VIJZELBERG', 'ILEX FOREST' is het 'EIKENWOUD'.\n- Een zo authentiek mogelijke ervaring. De game is grotendeels onaangeraakt gebleven, zodat het aanvoelt als een lokalisatie die in 2001 had kunnen verschijnen. Wel is het mogelijk Celebi te vangen nadat je de game hebt uitgespeeld - het is immers niet meer mogelijk die Pokémon nog op ouderwetse wijze op een evenement te bemachtigen.\n"},"pokemon-pinball":{"id":"pokemon-pinball","naam":"Pokémon Pinball","status":"gepland","teaser":"teasers/pinbal.png","kleur":"#3b4a63","body":"\n\n## Over dit project\n\nNog te schrijven.\n"},"pokemon-ruilkaartspel":{"id":"pokemon-ruilkaartspel","naam":"Pokémon Ruilkaartspel","status":"voltooid","teaser":"teasers/tcg2.png","kleur":"#3b4a63","voortgang":"poketcg_v2_nl","downloads":[{"label":"Download","url":"https://github.com/JappaWakka/poketcg_v2_nl/releases/tag/v1.7"}],"body":"\n## Over dit project\n\nPokémon Ruilkaartspel - een Nederlandse vertaling van Pokémon Trading Card Game op de Gameboy (Color) door JappaWakka.\nDeze romhack is gebaseerd op Shaoden's poketcg_v2 romhack sjabloon met wat extra aanpassingen en verbeteringen zoals dat Dr. Mason nu blauw haar heeft in plaats van wit haar, net zoals in het Japanse vervolg en dat de borden waarop de fase van het duel geschreven staan meer op die uit het Japanse vervolg lijken.\n"},"rood":{"id":"rood","naam":"Pokémon Rood & Blauw","status":"bezig","samenvatting":"Waar het allemaal begon: Kanto, 151 Pokémon en de reis naar de Elite Vier.","teaser":"teasers/poke-mon-red-aug-25-2023.jpg","kleur":"#d1534a","voortgang":"pokered-nl","downloads":[{"label":"Patches (Rood & Blauw)","url":"https://github.com/wfowler1/pokered-nl/releases","toelichting":"Nieuwste patch op de releasepagina"}],"body":"\nWIP\n"}},"edities":{"kristal":{"id":"kristal","naam":"Speciale Editie","status":"bezig","voortgang":"pokecrystal-nl-se","body":"\nIn de Speciale Editie hebben we nóg meer gelokaliseerd. Ook de namen van steden, Pokémon en sommige NPC's zijn nu Nederlandstalig. Daarnaast bevat deze versie van de game tal van verbeteringen, zoals de running shoes, etc.\n\nWIP, aanvullen.\n"}}}</script>

<script type="module">
import { esc, veiligeUrl, markdown, laadSite, laadProjecten, laadVoortgang } from './assets/content.js';
import { kaartHtml, sorteerProjecten } from './assets/site.js';
import { kopbalk, merknaam } from './assets/kop.js';

kopbalk();

const $ = (id) => document.getElementById(id);

// Zonder ingevulde uitnodigingslink verschijnt er geen knop. Een doodlopende Discord-link is
// erger dan geen knop: die kost een geïnteresseerde vrijwilliger een klik en vertrouwen.
function discordHtml(knop) {
  const url = veiligeUrl(knop && knop.url);
  if (!url) return '';
  return `<a class="knop knop--discord" href="${esc(url)}" target="_blank" rel="noopener">${esc(knop.label || 'Kom langs op onze Discord')}</a>`;
}

(async () => {
  let site;
  try {
    site = await laadSite();
  } catch (err) {
    $('groepen').innerHTML = '<p class="fout">De inhoud kon niet worden geladen. Ververs de pagina of probeer het later opnieuw.</p>';
    console.error(err);
    return;
  }

  document.title = `${site.titel || 'Zakmonsters'} — ${site.ondertitel || 'Nederlandse fanvertalingen'}`;
  merknaam(site.titel);
  $('titel').textContent = site.titel || 'Zakmonsters';
  $('ondertitel').textContent = site.ondertitel || '';
  $('intro').innerHTML = markdown(site.intro || '');
  $('voet').innerHTML = markdown(site.footer || '');

  if (site.meedoen && (site.meedoen.titel || site.meedoen.tekst)) {
    $('meedoen').hidden = false;
    $('meedoenTitel').textContent = site.meedoen.titel || 'Meehelpen?';
    $('meedoenTekst').innerHTML = markdown(site.meedoen.tekst || '');
    $('meedoenKnop').innerHTML = discordHtml(site.meedoen.discord);
  }

  // Projecten staan gebundeld onder een eigen kop ("Generatie 1", "Generatie 2", …). Een oudere
  // site.json met alleen een platte `projecten`-lijst blijft werken: die wordt één naamloze groep.
  const groepen = Array.isArray(site.groepen) && site.groepen.length
    ? site.groepen
    : [{ titel: '', projecten: site.projecten || [] }];

  const geladen = [];
  for (const groep of groepen) {
    geladen.push({
      titel: groep.titel || '',
      projecten: sorteerProjecten(await laadProjecten(groep.projecten)),
    });
  }
  const alles = geladen.flatMap((g) => g.projecten);
  if (!alles.length) {
    $('groepen').innerHTML = '<p class="leeg">Er staan nog geen projecten in de lijst.</p>';
    return;
  }

  // Eerst tekenen, daarna pas de voortgang ophalen: die komt van een andere server en mag de
  // pagina niet ophouden als die traag is of plat ligt.
  const teken = (voortgang) => {
    $('groepen').innerHTML = geladen
      .filter((g) => g.projecten.length)
      .map((g) => `${g.titel ? `<h2>${esc(g.titel)}</h2>` : ''}
        <div class="kaarten">${g.projecten.map((p) => kaartHtml(p, voortgang)).join('')}</div>`)
      .join('');
  };
  teken({});

  // Een voltooid project staat sowieso op 100%; alleen voor lopend werk is de editor nodig.
  const heeftLopend = alles.some((p) => p.voortgang && String(p.status || 'bezig').toLowerCase() !== 'voltooid');
  if (heeftLopend) teken(await laadVoortgang(site.voortgangBron));
})();
</script>
