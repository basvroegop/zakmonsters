<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zakmonsters — Nederlandse fanvertalingen</title>
<meta name="description" content="Fans en vrijwilligers die de klassieke Pokémon-games in het Nederlands vertalen. Bekijk de projecten en download de patches.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<main id="inhoud">
  <section class="held">
    <div class="omhulsel">
      <h1 id="titel">Zakmonsters</h1>
      <p class="ondertitel" id="ondertitel"></p>
      <div class="intro" id="intro"></div>
    </div>
  </section>

  <section class="projecten">
    <div class="omhulsel" id="groepen">
      <p class="laden">Projecten laden…</p>
    </div>
  </section>

  <section class="meedoen" id="meedoen" hidden>
    <div class="omhulsel">
      <h2 id="meedoenTitel"></h2>
      <div class="meedoen-tekst" id="meedoenTekst"></div>
      <div class="knoppen" id="meedoenKnop"></div>
    </div>
  </section>
</main>

<footer class="voet">
  <div class="omhulsel"><p id="voet"></p></div>
</footer>

<script type="module">
import { esc, veiligeUrl, markdown, laadSite, laadProjecten, laadVoortgang } from './assets/content.js';
import { kaartHtml } from './assets/site.js';

const $ = (id) => document.getElementById(id);

// Zonder ingevulde uitnodigingslink verschijnt er geen knop. Een doodlopende Discord-link is
// erger dan geen knop: die kost een geïnteresseerde vrijwilliger een klik en vertrouwen.
function discordHtml(knop) {
  const url = veiligeUrl(knop && knop.url);
  if (!url) return '';
  return `<a class="knop knop--discord" href="${esc(url)}" target="_blank" rel="noopener">${esc(knop.label || 'Kom langs op onze Discord')}</a>`;
}

(async () => {
  let site;
  try {
    site = await laadSite();
  } catch (err) {
    $('groepen').innerHTML = '<p class="fout">De inhoud kon niet worden geladen. Ververs de pagina of probeer het later opnieuw.</p>';
    console.error(err);
    return;
  }

  document.title = `${site.titel || 'Zakmonsters'} — ${site.ondertitel || 'Nederlandse fanvertalingen'}`;
  $('titel').textContent = site.titel || 'Zakmonsters';
  $('ondertitel').textContent = site.ondertitel || '';
  $('intro').innerHTML = markdown(site.intro || '');
  $('voet').innerHTML = markdown(site.footer || '');

  if (site.meedoen && (site.meedoen.titel || site.meedoen.tekst)) {
    $('meedoen').hidden = false;
    $('meedoenTitel').textContent = site.meedoen.titel || 'Meehelpen?';
    $('meedoenTekst').innerHTML = markdown(site.meedoen.tekst || '');
    $('meedoenKnop').innerHTML = discordHtml(site.meedoen.discord);
  }

  // Projecten staan gebundeld onder een eigen kop ("Generatie 1", "Generatie 2", …). Een oudere
  // site.json met alleen een platte `projecten`-lijst blijft werken: die wordt één naamloze groep.
  const groepen = Array.isArray(site.groepen) && site.groepen.length
    ? site.groepen
    : [{ titel: '', projecten: site.projecten || [] }];

  const geladen = [];
  for (const groep of groepen) {
    geladen.push({ titel: groep.titel || '', projecten: await laadProjecten(groep.projecten) });
  }
  const alles = geladen.flatMap((g) => g.projecten);
  if (!alles.length) {
    $('groepen').innerHTML = '<p class="leeg">Er staan nog geen projecten in de lijst.</p>';
    return;
  }

  // Eerst tekenen, daarna pas de voortgang ophalen: die komt van een andere server en mag de
  // pagina niet ophouden als die traag is of plat ligt.
  const teken = (voortgang) => {
    $('groepen').innerHTML = geladen
      .filter((g) => g.projecten.length)
      .map((g) => `${g.titel ? `<h2>${esc(g.titel)}</h2>` : ''}
        <div class="kaarten">${g.projecten.map((p) => kaartHtml(p, voortgang)).join('')}</div>`)
      .join('');
  };
  teken({});

  // Een voltooid project staat sowieso op 100%; alleen voor lopend werk is de editor nodig.
  const heeftLopend = alles.some((p) => p.voortgang && String(p.status || 'bezig').toLowerCase() !== 'voltooid');
  if (heeftLopend) teken(await laadVoortgang(site.voortgangBron));
})();
</script>
</body>
</html>
